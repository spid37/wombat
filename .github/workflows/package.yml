on:
  push:
    tags:
      - v*

jobs:
  package:
    strategy:
      matrix:
        include:
          - platform: macos-14
            go-version: "1.27.x"
            os_name: darwin
          - platform: ubuntu-22.04
            go-version: "1.27.x"
            os_name: linux
          - platform: windows-2022
            go-version: "1.27.x"
            os_name: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Get version tag
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # darwin (Apple Silicon)
      - name: Build for darwin
        if: matrix.os_name == 'darwin'
        shell: bash
        run: |
          MACOSX_DEPLOYMENT_TARGET=13.0 \
          CGO_CFLAGS="-mmacosx-version-min=13.0" \
          CGO_LDFLAGS="-mmacosx-version-min=13.0" \
          wails build -platform darwin/arm64 -ldflags "-X wombat/internal/app.semver=${{ steps.version.outputs.tag }}"

      - name: Create darwin disk image
        if: matrix.os_name == 'darwin'
        shell: bash
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Wombat" \
            --volicon "assets/darwin/dmg_icon.icns" \
            --background "assets/darwin/dmg_bg.png" \
            --window-size 512 360 \
            --icon-size 100 \
            --icon "Wombat.app" 100 185 \
            --hide-extension "Wombat.app" \
            --app-drop-link 388 185 \
            "Wombat_${{ steps.version.outputs.tag }}_Darwin_arm64.dmg" \
            "build/bin"

      - name: Upload darwin disk image
        if: matrix.os_name == 'darwin'
        uses: actions/upload-artifact@v7
        with:
          name: Wombat_${{ steps.version.outputs.tag }}_Darwin_arm64.dmg
          path: Wombat_${{ steps.version.outputs.tag }}_Darwin_arm64.dmg

      # linux
      - name: Install linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build for linux
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          wails build -platform linux/amd64 -ldflags "-X wombat/internal/app.semver=${{ steps.version.outputs.tag }}"
          tar -C build/bin -zcvf "Wombat_${{ steps.version.outputs.tag }}_Linux_x86_64.tar.gz" wombat

      - name: Upload linux tar.gz
        if: matrix.os_name == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: Wombat_${{ steps.version.outputs.tag }}_Linux_x86_64.tar.gz
          path: Wombat_${{ steps.version.outputs.tag }}_Linux_x86_64.tar.gz

      # windows
      - name: Build for windows
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          wails build -platform windows/amd64 -ldflags "-X wombat/internal/app.semver=${{ steps.version.outputs.tag }}"
          powershell -Command "Compress-Archive -Path build/bin/wombat.exe -DestinationPath Wombat_${{ steps.version.outputs.tag }}_Windows_x86_64.zip"

      - name: Upload windows zip
        if: matrix.os_name == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: Wombat_${{ steps.version.outputs.tag }}_Windows_x86_64.zip
          path: Wombat_${{ steps.version.outputs.tag }}_Windows_x86_64.zip

  release:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - name: Get version tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Get changelog url
        id: changelog
        run: |
          slug=$(echo "${{ steps.version.outputs.tag }}---$(date +'%Y-%m-%d')" | sed -e 's/\.//g')
          echo "url=https://github.com/spid37/wombat/blob/master/CHANGELOG.md#${slug}" >> "$GITHUB_OUTPUT"

      - name: Download all release packages
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: Full changelog ⇒ [${{ steps.version.outputs.tag }}](${{ steps.changelog.outputs.url }})
          draft: false
          files: |
            Wombat_${{ steps.version.outputs.tag }}_Darwin_arm64.dmg
            Wombat_${{ steps.version.outputs.tag }}_Linux_x86_64.tar.gz
            Wombat_${{ steps.version.outputs.tag }}_Windows_x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
